[project]
name = "semantic-visual-prompt-irstd"
version = "0.1.0"
description = "Training-free semantic visual prompting for infrared small targets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.12.0.88",
    "pillow>=10.0",
    "pyyaml>=6.0.2",
    "scikit-image>=0.25.2",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "timm>=1.0.0",
    "tqdm>=4.66.0",
]
