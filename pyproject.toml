[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-visual-prompt-irstd"
version = "0.1.0"
description = "CoRe-IR few-shot infrared small-target segmentation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.12.0.88",
    "pillow>=10.0",
    "pyyaml>=6.0.2",
    "scikit-image>=0.25.2",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "timm>=1.0.27",
    "tqdm>=4.66.0",
    "einops>=0.8",
    "hydra-core>=1.3.2",
    "psutil>=5.9",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["visual_prompt*"]
namespaces = false

[tool.setuptools.package-data]
"visual_prompt.backbones.mobile_sam" = ["LICENSE.txt", "THIRD_PARTY_NOTICE.md"]
